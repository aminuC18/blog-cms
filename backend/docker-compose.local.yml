# Optional overlay: local MongoDB + Redis (instead of Atlas / cloud Redis).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# In .env use:
#   MONGO_URI=mongodb://mongodb:27017/blogdb
#   REDIS_URL=redis://redis:6379

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: []
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    environment:
      MONGO_URI: mongodb://mongodb:27017/blogdb
      REDIS_URL: redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongo_data:
