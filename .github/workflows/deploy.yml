name: Deploy to Contabo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-contabo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if printf '%s' "$SSH_PRIVATE_KEY" | grep -q 'BEGIN.*PRIVATE KEY'; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          echo "Deploy key fingerprint:"
          ssh-keygen -l -f ~/.ssh/deploy_key

          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify SSH connection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          DEPLOY_USER="${DEPLOY_USER:-root}"
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" 'echo "SSH OK"'

      - name: Rsync to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          DEPLOY_USER="${DEPLOY_USER:-root}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/blog-cms}"
          rsync -avz --delete \
            --exclude node_modules \
            --exclude .next \
            --exclude dist \
            --exclude .git \
            --exclude 'backend/.env' \
            --exclude 'frontend/.env' \
            --exclude deploy/deploy.config \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Rebuild containers
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          DEPLOY_USER="${DEPLOY_USER:-root}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/blog-cms}"
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' bash '${DEPLOY_PATH}/deploy/scripts/rebuild.sh'"
